# 提交前自动检查。安装：pip install pre-commit && pre-commit install
# 依赖：本机已安装 Node.js（建议 18 及以上）
repos:
  - repo: local
    hooks:
      - id: check-format
        name: 格式检查（行尾空格 / 换行 / Tab 缩进）
        entry: node scripts/check_format.mjs
        language: system
        types: [text]
      - id: check-strings
        name: 资源一致性检查
        entry: node scripts/check_strings.mjs
        language: system
        files: \.(ets|json)$
        pass_filenames: false
